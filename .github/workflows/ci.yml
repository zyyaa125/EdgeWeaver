name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  moonbit:
    name: MoonBit checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s latest
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Check formatting
        run: moon fmt --check

      - name: Check packages
        run: moon check --deny-warn

      - name: Build native target
        run: moon build

      - name: Run tests
        run: moon test --deny-warn

      - name: Write restart checkpoint
        run: moon run cmd/recovery -- write "$RUNNER_TEMP/edgeweaver-recovery.json"

      - name: Replay after process restart
        run: moon run cmd/recovery -- replay "$RUNNER_TEMP/edgeweaver-recovery.json"

      - name: Persist uncertain execution
        run: moon run cmd/safety -- write "$RUNNER_TEMP/edgeweaver-execution.json"

      - name: Refuse duplicate side effect after restart
        run: moon run cmd/safety -- resume "$RUNNER_TEMP/edgeweaver-execution.json"
